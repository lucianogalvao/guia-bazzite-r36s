# ~/.config/systemd/user/app-dev.lizardbyte.app.Sunshine.service.d/override.conf
# Ajustes que o `ujust setup-sunshine` aplica no serviço do brew. Aqui ficam à mão, porque
# o ujust procura o nome antigo (homebrew.sunshine) e não aplica sozinho.
[Unit]
After=graphical-session.target xdg-desktop-autostart.target xdg-desktop-portal.service

[Service]
ExecStartPre=/bin/sleep 5
ExecStopPost=/usr/libexec/sunshine-stop-vmon
Restart=on-failure
RestartSec=5s
